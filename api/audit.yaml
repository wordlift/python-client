        - vendor
        - status
    WellKnownFiles:
      type: object
      properties:
        mcpJson:
          type: boolean
          description: Whether `/.well-known/mcp.json` exists (legacy MCP server manifest path)
        mcpServerCard:
          type: boolean
          description: Whether `/.well-known/mcp/server-card.json` exists (MCP server card, SEP-1649 draft)
        webmcpToolsJson:
          type: boolean
          description: Whether `/.well-known/webmcp/tools.json` exists (Chrome Labs WebMCP tools manifest)
        mcpLinkTag:
          type: boolean
          description: Whether a `<link rel="mcp">` discovery tag was detected in the page HTML
        mcpEndpoint:
          type:
            - string
            - 'null'
          description: The href value of the `<link rel="mcp">` tag, if present; null otherwise
        agentSkillsIndex:
          type: boolean
          description: Whether `/.well-known/agent-skills/index.json` exists (Agent Skills Discovery, Cloudflare RFC v0.2.0)
        agentSkillsCount:
          type: integer
          minimum: 0
          description: Number of skills listed in the Agent Skills Discovery index (0 when the index is absent or empty)
