                - rate_limited
                - site_error
                - unreachable
              description: 'Only when status is "unknown". blocked: the site refused the request (401/403); rate_limited: the site throttled the request (429), possibly because of the audit''s own parallel requests; site_error: the site answered with another error status; unreachable: the site never answered (timeout, network or proxy failure)'
          required:
            - status
