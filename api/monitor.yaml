openapi: 3.1.0
info:
  title: WordLift Monitor API
  version: 2.21.0
paths:
  /accounts/{account_id}/monitoring/monitors:
    post:
      tags:
      - Monitors
      summary: Add Monitor
      description: Adds a URL to the monitoring list for the given account.
      operationId: add_monitor_accounts__account_id__monitoring_monitors_post
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                url:
                  format: uri
                  maxLength: 2083
                  minLength: 1
                  title: Url
                  type: string
                type:
                  enum:
                  - page
                  - sitemap
                  - config
                  - asset
                  title: ResourceType
                  type: string
              required:
              - url
              title: AddResourceRequest
              type: object
    get:
      tags:
      - Monitors
      summary: List Monitors
      operationId: list_monitors_accounts__account_id__monitoring_monitors_get
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MonitorStatus'
          description: Filter by monitor status.
          default: active
        description: Filter by monitor status.
      - name: segment_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Return only monitors whose URL is matched by the given segment's
            matchers.
          title: Segment Id
        description: Return only monitors whose URL is matched by the given segment's
          matchers.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          description: Maximum number of items to return.
          default: 100
          title: Limit
        description: Maximum number of items to return.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip.
          default: 0
          title: Offset
        description: Number of items to skip.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMonitorsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Monitors
      summary: Replace Monitors
      operationId: replace_monitors_accounts__account_id__monitoring_monitors_put
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonitorResponse'
                title: Response Replace Monitors Accounts  Account Id  Monitoring
                  Monitors Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                items:
                  items:
                    properties:
                      url:
                        format: uri
                        maxLength: 2083
                        minLength: 1
                        title: Url
                        type: string
                      type:
                        enum:
                        - page
                        - sitemap
                        - config
                        - asset
                        title: ResourceType
                        type: string
                    required:
                    - url
                    title: ReplaceMonitorItem
                    type: object
                  title: Items
                  type: array
              required:
              - items
              title: ReplaceMonitorsRequest
              type: object
  /accounts/{account_id}/monitoring/monitors/{monitor_id}:
    get:
      tags:
      - Monitors
      summary: Get Monitor
      operationId: get_monitor_accounts__account_id__monitoring_monitors__monitor_id__get
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          title: Monitor Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Monitors
      summary: Update Monitor
      operationId: update_monitor_accounts__account_id__monitoring_monitors__monitor_id__put
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          title: Monitor Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                url:
                  format: uri
                  maxLength: 2083
                  minLength: 1
                  title: Url
                  type: string
                type:
                  enum:
                  - page
                  - sitemap
                  - config
                  - asset
                  title: ResourceType
                  type: string
              required:
              - url
              title: AddResourceRequest
              type: object
    delete:
      tags:
      - Monitors
      summary: Delete Monitor
      operationId: delete_monitor_accounts__account_id__monitoring_monitors__monitor_id__delete
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          title: Monitor Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/monitoring/runs:
    get:
      tags:
      - Monitor Runs
      summary: List Runs
      operationId: list_runs_accounts__account_id__monitoring_runs_get
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          description: Maximum number of items to return.
          default: 5
          title: Limit
        description: Maximum number of items to return.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip.
          default: 0
          title: Offset
        description: Number of items to skip.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRunsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/monitoring/runs/{run_id}:
    get:
      tags:
      - Monitor Runs
      summary: Get Run
      operationId: get_run_accounts__account_id__monitoring_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Monitor Runs
      summary: Abort Run
      operationId: abort_run_accounts__account_id__monitoring_runs__run_id__delete
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/monitoring/segments:
    post:
      tags:
      - Segments
      summary: Create Segment
      description: Create a segment for the account.
      operationId: create_segment_accounts__account_id__monitoring_segments_post
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Segments
      summary: List Segments
      operationId: list_segments_accounts__account_id__monitoring_segments_get
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive substring search across name and description.
          title: Q
        description: Case-insensitive substring search across name and description.
      - name: order_by
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SegmentOrderBy'
          description: Field to sort by.
          default: created_at
        description: Field to sort by.
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortDirection'
          description: Sort direction.
          default: asc
        description: Sort direction.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque pagination cursor from a previous response.
          title: Cursor
        description: Opaque pagination cursor from a previous response.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Maximum number of segments to return.
          default: 50
          title: Limit
        description: Maximum number of segments to return.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSegmentsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/monitoring/segments/{segment_id}:
    get:
      tags:
      - Segments
      summary: Get Segment
      operationId: get_segment_accounts__account_id__monitoring_segments__segment_id__get
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
          title: Segment Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Segments
      summary: Update Segment
      description: "Replace the segment's mutable fields.\n\nPUT replaces *every*\
        \ mutable field; an omitted field is reset to its\ndefault. For ``description``,\
        \ the default is ``null`` \u2014 so a body\nthat omits ``description`` clears\
        \ any existing value. Clients that\nwant to preserve a field must send it\
        \ explicitly."
      operationId: update_segment_accounts__account_id__monitoring_segments__segment_id__put
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
          title: Segment Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Segments
      summary: Delete Segment
      operationId: delete_segment_accounts__account_id__monitoring_segments__segment_id__delete
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
          title: Segment Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/monitoring/segments/{segment_id}/globs:
    get:
      tags:
      - Segment Globs
      summary: List Segment Globs
      description: Return a page of glob matchers, ordered by ``(created_at, id)``.
      operationId: list_segment_globs_accounts__account_id__monitoring_segments__segment_id__globs_get
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
          title: Segment Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque pagination cursor from a previous response.
          title: Cursor
        description: Opaque pagination cursor from a previous response.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Max glob matchers per page.
          default: 100
          title: Limit
        description: Max glob matchers per page.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSegmentGlobsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Segment Globs
      summary: Add Segment Glob
      description: Add a single glob matcher; idempotent on duplicate.
      operationId: add_segment_glob_accounts__account_id__monitoring_segments__segment_id__globs_post
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
          title: Segment Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSegmentGlobRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentGlobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Segment Globs
      summary: Replace Segment Globs
      description: Wholesale replace all glob matchers for the segment.
      operationId: replace_segment_globs_accounts__account_id__monitoring_segments__segment_id__globs_put
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
          title: Segment Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceSegmentGlobsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SegmentGlobResponse'
                title: Response Replace Segment Globs Accounts  Account Id  Monitoring
                  Segments  Segment Id  Globs Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/monitoring/segments/{segment_id}/globs/{glob_id}:
    delete:
      tags:
      - Segment Globs
      summary: Delete Segment Glob
      operationId: delete_segment_glob_accounts__account_id__monitoring_segments__segment_id__globs__glob_id__delete
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
          title: Segment Id
      - name: glob_id
        in: path
        required: true
        schema:
          type: string
          title: Glob Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/monitoring/segments/{segment_id}/urls:
    get:
      tags:
      - Segment URLs
      summary: List Segment Urls
      description: Return a page of URL matchers, ordered by ``(created_at, id)``.
      operationId: list_segment_urls_accounts__account_id__monitoring_segments__segment_id__urls_get
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
          title: Segment Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque pagination cursor from a previous response.
          title: Cursor
        description: Opaque pagination cursor from a previous response.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Max URL matchers per page.
          default: 100
          title: Limit
        description: Max URL matchers per page.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSegmentUrlsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Segment URLs
      summary: Add Segment Url
      description: Add a single URL matcher; idempotent on duplicate.
      operationId: add_segment_url_accounts__account_id__monitoring_segments__segment_id__urls_post
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
          title: Segment Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentUrlResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: 'Body for ``POST /segments/{id}/urls``.


                URL is normalized and validated to be in scope of the account base

                (``is_in_scope``); out-of-scope URLs are rejected with 422.'
              properties:
                url:
                  format: uri
                  maxLength: 2083
                  minLength: 1
                  title: Url
                  type: string
              required:
              - url
              title: AddSegmentUrlRequest
              type: object
    put:
      tags:
      - Segment URLs
      summary: Replace Segment Urls
      description: Wholesale replace all URL matchers for the segment.
      operationId: replace_segment_urls_accounts__account_id__monitoring_segments__segment_id__urls_put
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
          title: Segment Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SegmentUrlResponse'
                title: Response Replace Segment Urls Accounts  Account Id  Monitoring
                  Segments  Segment Id  Urls Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: 'Body for ``PUT /segments/{id}/urls``.


                URLs are normalized and validated to be in scope of the account base

                (``is_in_scope``); any out-of-scope URL fails the whole request with

                422 listing the offenders.'
              properties:
                urls:
                  items:
                    format: uri
                    maxLength: 2083
                    minLength: 1
                    type: string
                  title: Urls
                  type: array
              required:
              - urls
              title: ReplaceSegmentUrlsRequest
              type: object
  /accounts/{account_id}/monitoring/segments/{segment_id}/urls/{url_id}:
    delete:
      tags:
      - Segment URLs
      summary: Delete Segment Url
      operationId: delete_segment_url_accounts__account_id__monitoring_segments__segment_id__urls__url_id__delete
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
          title: Segment Id
      - name: url_id
        in: path
        required: true
        schema:
          type: string
          title: Url Id
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/monitoring/expectations:
    post:
      tags:
      - Expectations
      summary: Create Expectation
      description: 'Create a rule. Idempotent on conflict: an identical (type, config)

        rule returns the existing rule with 200; a new rule returns 201.

        Attachments (and their severity) are managed via the segments

        sub-resource.'
      operationId: create_expectation_accounts__account_id__monitoring_expectations_post
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          title: Account Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/StructuredDataExpectationRequest'
              discriminator:
                propertyName: type
                mapping:
                  structured_data: '#/components/schemas/StructuredDataExpectationRequest'
              title: Body
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/StructuredDataExpectationResponse'
                discriminator:
                  propertyName: type
                  mapping:
                    structured_data: '#/components/schemas/StructuredDataExpectationResponse'
                title: Response Create Expectation Accounts  Account Id  Monitoring
                  Expectations Post
        '200':
          description: An identical (type, config) rule already existed
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/StructuredDataExpectationResponse'
