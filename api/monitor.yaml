    SegmentSeverityResponse:
      properties:
        segment_id:
          type: string
          title: Segment Id
        severity:
          $ref: '#/components/schemas/ExpectationSeverity'
      type: object
      required:
      - segment_id
      - severity
      title: SegmentSeverityResponse
      description: "Response for every segment-attachment endpoint (attach, replace,\
        \ and\nlist) \u2014 none of them hydrates a full Segment. The frontend already\n\
        holds the full segment catalog (a small, bounded set fetched on many\npages),\
        \ so this only needs to report segment_id/severity. Also doubles\nas the segment-membership\
        \ shape nested in ExpectationEvaluationSummary\nbelow, since both are the\
        \ same (segment_id, severity) pairing."
    SegmentUrlResponse:
      properties:
        id:
