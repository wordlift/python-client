      - desc
      title: SortDirection
    StructuredDataConstraint:
      type: string
      enum:
      - present
      - absent
      title: StructuredDataConstraint
      description: Whether the structured-data shape must be observed or must not
        be.
    StructuredDataExpectationConfig:
      properties:
        entity_type:
          type: string
          minLength: 1
          title: Entity Type
        property_path:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Property Path
        constraint:
          $ref: '#/components/schemas/StructuredDataConstraint'
      additionalProperties: false
      type: object
      required:
      - entity_type
      - constraint
      title: StructuredDataExpectationConfig
      description: "Config payload for an expectation triggered by ``structured_data_check``.\n\
        \nEach field describes a structured-data assertion specifically \u2014 the\n\
        naming is intentionally not generic, since a future check (e.g. a\nlatency\
        \ assertion) will get its own config class with its own\ndomain-specific field\
        \ names rather than reusing this shape.\n\n``property_path`` distinguishes\
        \ entity-level rules (``None``) from\nproperty-level rules (set) \u2014 there\
        \ is no cross-field validator; the\nnullability of ``property_path`` does\
        \ the work.\n\nThe domain shape is always the current version; payload-version\n\
        tracking and upgrades live at the storage boundary in\n``expectation_repository``."
    StructuredDataExpectationRequest:
      properties:
        type:
          type: string
          const: structured_data
          title: Type
        config:
          $ref: '#/components/schemas/StructuredDataExpectationConfig'
      type: object
      required:
      - type
      - config
      title: StructuredDataExpectationRequest
    StructuredDataExpectationResponse:
      properties:
        id:
          type: string
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        type:
          type: string
          const: structured_data
          title: Type
        config:
          $ref: '#/components/schemas/StructuredDataExpectationConfig'
      type: object
      required:
      - id
      - created_at
      - type
      - config
      title: StructuredDataExpectationResponse
    ValidationError:
